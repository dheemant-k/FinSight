# ==============================================================================
# FinSight Risk Rules Configuration
#
# Loaded by `finsight.risk_rules.RiskEngine` (via RiskEngineConfig.from_yaml).
# Changing a threshold or weight here changes engine behaviour without code edits.
#
# Each rule `id` must match an evaluator implemented in src/finsight/risk_rules.py;
# unknown ids are rejected at load time so this file can never drift from the code.
# ==============================================================================

version: "1.1.0"

scoring_framework:
  baseline_score: 0
  max_score: 100
  risk_tiers:
    low:
      min: 0
      max: 29
      action: "AUTO_APPROVE"
    medium:
      min: 30
      max: 69
      action: "MANUAL_REVIEW"
    high:
      min: 70
      max: 100
      action: "FLAG_SUSPICIOUS"

rules:
  - id: "RULE_001_HIGH_VALUE"
    name: "Excessive Single Transaction Amount"
    description: "Flags transactions exceeding single-transaction monetary threshold."
    category: "VALUE_ANOMALY"
    severity: "HIGH"
    risk_points: 35
    enabled: true
    parameters:
      threshold_amount: 200000.00
    rationale: >-
      In PaySim, fraudulent transfers and cash-outs average ~$1.47M, compared to ~$173k
      for legitimate cash-outs. High-value transactions carry outsized loss exposure.
    limitations: >-
      Large transactions occur legitimately for payroll, B2B procurement, or asset
      purchases. Value alone has a significant false-positive rate.

  - id: "RULE_002_DRAINAGE_RAIL"
    name: "Fund Drainage Rail Exposure"
    description: "Flags transactions using CASH_OUT or TRANSFER payment rails."
    category: "RAIL_EXPOSURE"
    severity: "MEDIUM"
    risk_points: 25
    enabled: true
    parameters:
      high_risk_rails: ["TRANSFER", "CASH_OUT"]
    rationale: >-
      In PaySim, 100% of labelled fraud occurs on TRANSFER or CASH_OUT.
      PAYMENT, CASH_IN, and DEBIT contain no labelled fraud.
    limitations: >-
      Over 99% of TRANSFER and CASH_OUT volume is legitimate. Rail type alone
      cannot establish intent.

  - id: "RULE_003_OVERNIGHT_DRAINAGE"
    name: "Off-Hours Drainage Activity"
    description: "Flags transfers or cash-outs of meaningful size during low-volume overnight hours."
    category: "TEMPORAL_ANOMALY"
    severity: "HIGH"
    risk_points: 25
    enabled: true
    parameters:
      overnight_hours: [1, 2, 3, 4, 5]
      min_amount: 10000.00
      target_rails: ["TRANSFER", "CASH_OUT"]
    rationale: >-
      Legitimate simulated volume drops sharply overnight while fraud volume does not,
      so overnight drainage transactions are disproportionately fraudulent.
    limitations: >-
      Night-shift workers, scheduled payments, and cross-border users transact
      overnight without malicious intent. Hours are simulated, not real clock times.

  - id: "RULE_004_LARGE_ROUND_AMOUNT"
    name: "Elevated Round Amount Disparity"
    description: "Flags large round-denomination disbursements on drainage rails."
    category: "STRUCTURAL_ANOMALY"
    severity: "MEDIUM"
    risk_points: 15
    enabled: true
    parameters:
      min_amount: 50000.00
      round_modulus: 5000.00
      target_rails: ["TRANSFER", "CASH_OUT"]
    rationale: >-
      Account liquidations often hit round limit ceilings rather than odd-cent amounts.
    limitations: >-
      Wholesale funding and inter-account transfers frequently use clean multiples.
