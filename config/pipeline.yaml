# ==============================================================================
# FinSight Pipeline Configuration (PaySim)
#
# NOTE: reference only. These values mirror the defaults hard-coded in
# src/finsight/pipeline.py and src/finsight/load_to_postgres.py, which do not read
# this file yet. Wiring it in is planned (see README roadmap); until then, change
# behaviour through each script's command-line flags.
# ==============================================================================

pipeline:
  name: "finsight_transaction_pipeline"
  version: "1.1.0"

ingestion:
  source_file: "PS_20174392719_1491204439457_log.csv"   # resolved in data/raw/ or repo root
  chunk_size: 250000                                    # pipeline.py --chunk-size
  output_path: "data/processed/transactions.csv.gz"
  report_path: "reports/data_quality/pipeline_run.json"

validation:
  required_columns:
    - step
    - type
    - amount
    - nameOrig
    - oldbalanceOrg
    - newbalanceOrig
    - nameDest
    - oldbalanceDest
    - newbalanceDest
    - isFraud
    - isFlaggedFraud
  allowed_transaction_types: ["CASH_OUT", "TRANSFER", "PAYMENT", "CASH_IN", "DEBIT"]
  min_step: 1
  min_amount: 0.0
  binary_columns: ["isFraud", "isFlaggedFraud"]

derived_features:
  transaction_hour: "(step - 1) % 24"
  transaction_day: "((step - 1) // 24) + 1"

database:
  target_schema: "public"
  fact_table: "fct_transactions"
  load_chunk_size: 100000                               # load_to_postgres.py --chunk-size
